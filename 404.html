<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pâtisserie Dzung | Đang chuyển hướng...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #FCF8F0;
      color: #143D2B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .redirect-card {
      padding: 32px 24px;
      border: 2px solid #143D2B;
      border-radius: 18px;
      background: #FFFFFF;
      box-shadow: 4px 4px 0 #E8A838;
      max-width: 340px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(20, 61, 43, 0.2);
      border-top-color: #143D2B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      color: #143D2B;
    }
    p {
      margin: 0 0 16px;
      font-size: 0.9rem;
      color: #555;
    }
    a {
      display: inline-block;
      padding: 9px 20px;
      background: #E8A838;
      color: #143D2B;
      text-decoration: none;
      font-weight: bold;
      border-radius: 999px;
      border: 1.5px solid #143D2B;
      box-shadow: 2px 2px 0 #143D2B;
    }
  </style>
  <script>
    (function() {
      const p = (window.location.pathname || '').toLowerCase();
      let targetHash = '';
      if (p.includes('menu') || p.includes('thuc-don') || p.includes('thucdon')) {
        targetHash = '#menu';
      } else if (p.includes('cater') || p.includes('traiteur') || p.includes('dat-tiec') || p.includes('tiec')) {
        targetHash = '#catering';
      } else if (p.includes('gallery') || p.includes('galerie')) {
        targetHash = '#gallery';
      } else if (p.includes('visit') || p.includes('visiter') || p.includes('story') || p.includes('contact') || p.includes('map')) {
        targetHash = '#visit';
      }
      const targetUrl = '/' + targetHash;
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h2>Pâtisserie Dzung</h2>
    <p>Đang chuyển bạn đến đúng trang...</p>
    <a href="/#menu">Bấm vào đây để vào Thực Đơn</a>
  </div>
</body>
</html>
