<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/#menu">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://patisseriedzung.ca/#menu">
  <title>Thực Đơn Menu | Pâtisserie Dzung</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #FCF8F0;
      color: #143D2B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .loader-card {
      padding: 28px 24px;
      border: 2px solid #143D2B;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 4px 4px 0 #E8A838;
      max-width: 320px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(20, 61, 43, 0.2);
      border-top-color: #143D2B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 16px;
      background: #E8A838;
      color: #143D2B;
      text-decoration: none;
      font-weight: bold;
      border-radius: 999px;
      border: 1.5px solid #143D2B;
    }
  </style>
  <script>
    window.location.replace('/#menu');
  </script>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <p style="margin: 0; font-weight: 700;">Đang mở thực đơn Pâtisserie Dzung...</p>
    <a href="/#menu">Bấm vào đây nếu không tự chuyển</a>
  </div>
</body>
</html>
